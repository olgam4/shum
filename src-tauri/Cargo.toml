[package]
name = "shum"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "shum_lib"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
opt-level = "s"
